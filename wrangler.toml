name = "mailfree"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars = true

# D1: set your real database_id locally. Do not commit production IDs.
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "maill_free_db"
database_id = "00000000-0000-0000-0000-000000000000"

# Non-secret defaults only. Put ADMIN_PASSWORD, JWT_TOKEN, RESEND_API_KEY
# in Cloudflare Workers secrets or a gitignored .dev.vars file:
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put JWT_TOKEN
#   wrangler secret put RESEND_API_KEY
[vars]
ADMIN_NAME = "admin"
GUEST_PASSWORD = "guest"
SESSION_EXPIRE_DAYS = "7"
MAIL_DOMAIN = "example.com"

[assets]
directory = "public"
binding = "ASSETS"

[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"
